name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  setup:
    name: Set up Node.js and install dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Save node_modules to cache
        uses: actions/cache/save@v5
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-npm-modules-${{ hashFiles('**/package-lock.json') }}

  run-linters:
    name: Run linters
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: 'npm'

      - name: Restore node_modules from cache
        uses: actions/cache/restore@v5
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-npm-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Lint
        run: npm run lint:check && npm run align-deps

  run-typecheck:
    name: Run typecheck
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: 'npm'

      - name: Restore node_modules from cache
        uses: actions/cache/restore@v5
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-npm-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Types
        run: npm run types:check

  run-tests:
    name: Run tests
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: 'npm'

      - name: Restore node_modules from cache
        uses: actions/cache/restore@v5
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-npm-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Tests
        run: npm run tests

  release-build:
    name: Create main branch release build
    runs-on: ubuntu-latest
    needs:
      - setup
      - run-linters
      - run-typecheck
      - run-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: 'npm'

      - name: Restore node_modules from cache
        uses: actions/cache/restore@v5
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-npm-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build Android release
        run: npm run release:android

      - name: Prepare release metadata
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "RELEASE_TAG=main-${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=Main build ${short_sha}" >> "$GITHUB_ENV"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            Automated Android release build for a commit on the main branch.

            Commit: ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: android/app/build/outputs/apk/release/app-release.apk
